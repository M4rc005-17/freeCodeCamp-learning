<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>freeCodeCamp-learning</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap');

:root {
  --bg: #1a1d24;
  --card: #20242e;
  --card-hover: #262b37;
  --border: #2e3440;
  --text: #e7e9ee;
  --muted: #8b93a3;
  --accent: #5b9bf5;
  --accent-soft: rgba(91,155,245,.16);
  --file-accent: #5cc9b0;
  --file-soft: rgba(92,201,176,.16);
  --danger: #e8768a;
}

* { box-sizing: border-box; }
html { color-scheme: dark; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background:
    radial-gradient(ellipse 900px 420px at 50% -12%, rgba(91,155,245,.14), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
}

.page { max-width: 720px; margin: 0 auto; padding: clamp(1.5rem, 5vw, 3rem) 1.25rem 4rem; }

header { margin-bottom: 1.5rem; }
h1 {
  font-family: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: clamp(1.5rem, 4vw, 1.9rem);
  font-weight: 700;
  letter-spacing: -.01em;
  margin: 0 0 .35rem;
  word-break: break-word;
  color: #fbfcfe;
}
#status { color: var(--muted); font-size: .9rem; margin: 0 0 1.1rem; }
#status.error { color: var(--danger); }

.search-box { position: relative; }
.search-box svg {
  position: absolute; left: .9rem; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; color: var(--muted); pointer-events: none;
}
#search {
  width: 100%;
  padding: .75rem .9rem .75rem 2.5rem;
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: .95rem;
  background: var(--card);
  color: var(--text);
  transition: border-color .15s ease, box-shadow .15s ease;
}
#search::placeholder { color: var(--muted); }
#search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 24px 60px rgba(0,0,0,.35);
  overflow: hidden;
}

#breadcrumb {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: .35rem; padding: 1rem 1.2rem; font-size: .9rem;
  border-bottom: 1px solid var(--border);
  color: var(--muted);
}
#breadcrumb a { color: var(--accent); text-decoration: none; }
#breadcrumb a:hover { text-decoration: underline; }
#breadcrumb .sep { color: #454c5c; }
#breadcrumb .current { color: var(--text); font-weight: 600; }

#listing { padding: .5rem; }

.row {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .7rem .8rem;
  margin: .15rem 0;
  border-radius: 10px;
  border-left: 3px solid transparent;
  text-decoration: none;
  color: var(--text);
  transition: background .12s ease, transform .12s ease;
}
.row:hover { background: var(--card-hover); transform: translateX(2px); }
.row .icon { flex: none; width: 20px; height: 20px; }
.row.folder .icon { color: var(--accent); }
.row.file .icon { color: var(--file-accent); }
.row .label { flex: 1; min-width: 0; }
.row .name {
  font-family: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight: 600;
  display: block;
}
.row .context {
  display: block; color: var(--muted); font-size: .78em; margin-top: .15em;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 400;
}
.row .count {
  flex: none; font-size: .78rem; font-weight: 600;
  padding: .2em .6em; border-radius: 999px;
}
.row .chev { flex: none; width: 16px; height: 16px; color: #454c5c; }
.row.up { color: var(--muted); }
.row.up .icon { color: var(--muted); }

.notice { color: var(--muted); font-style: italic; padding: 1rem 1.1rem; }
.noscript-msg { max-width: 600px; margin: 3rem auto; padding: 1rem; text-align: center; color: var(--danger); }
</style>
</head>
<body>

<noscript><p class="noscript-msg">Questa pagina richiede JavaScript per leggere ed elencare i file dal repository GitHub.</p></noscript>

<div class="page">
  <header>
    <h1>freeCodeCamp-learning</h1>
    <p id="status">Caricamento della struttura del repository…</p>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="Cerca un esercizio in tutto il repository…" aria-label="Cerca un esercizio in tutto il repository">
    </div>
  </header>

  <div class="card">
    <nav id="breadcrumb"></nav>
    <main id="listing"></main>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ====================================================================
  // CONFIGURAZIONE — già impostata sui tuoi dati, cambia solo se serve
  var REPO_OWNER = 'M4rc005-17';
  var REPO_NAME = 'freeCodeCamp-learning';
  var REPO_BRANCH = 'main';
  // ====================================================================

  var KNOWN_COLORS = {
    css: '#5b9bf5', html: '#f2935c', javascript: '#e8d44d', js: '#e8d44d',
    python: '#6bb6e8', react: '#6bcbef', typescript: '#5b8cf5', ts: '#5b8cf5',
    java: '#e8a15c', node: '#7cc98f', nodejs: '#7cc98f', sql: '#c792ea',
    php: '#8e9ee8', ruby: '#e8687a', go: '#5bc8e8', rust: '#e89a5b'
  };
  var FALLBACK_PALETTE = ['#5b9bf5', '#f2935c', '#7cc98f', '#c792ea', '#e8768a', '#e8d44d', '#6bcbef'];

  var statusEl = document.getElementById('status');
  var breadcrumbEl = document.getElementById('breadcrumb');
  var listingEl = document.getElementById('listing');
  var searchInput = document.getElementById('search');

  var TREE = null;

  function isLinkable(filename) {
    return /\.html?$/i.test(filename);
  }

  function colorForName(name) {
    var key = name.toLowerCase().replace(/[^a-z0-9]/g, '');
    if (KNOWN_COLORS[key]) return KNOWN_COLORS[key];
    var hash = 0;
    for (var i = 0; i < name.length; i++) {
      hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    }
    return FALLBACK_PALETTE[hash % FALLBACK_PALETTE.length];
  }

  function hexToRgba(hex, alpha) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function buildTree(flatList) {
    var root = { name: '', isFile: false, children: {} };
    flatList.forEach(function (entry) {
      if (entry.type !== 'blob') return;
      var parts = entry.path.split('/');
      var node = root;
      for (var i = 0; i < parts.length; i++) {
        var part = parts[i];
        var isLast = i === parts.length - 1;
        if (isLast) {
          if (parts.length === 1 && part.toLowerCase() === 'index.html') return;
          var base = part.replace(/\.html?$/i, '');
          var label = base;
          if (base.toLowerCase() === 'index' && parts.length > 1) {
            label = parts[parts.length - 2];
          }
          node.children[part] = { name: part, isFile: true, path: entry.path, label: label, children: {} };
        } else {
          if (!node.children[part]) {
            node.children[part] = { name: part, isFile: false, children: {} };
          }
          node = node.children[part];
        }
      }
    });
    return root;
  }

  function countLinkable(node) {
    if (node.isFile) return isLinkable(node.name) ? 1 : 0;
    var total = 0;
    Object.keys(node.children).forEach(function (k) {
      total += countLinkable(node.children[k]);
    });
    return total;
  }

  function sortedKeys(obj) {
    return Object.keys(obj).sort(function (a, b) { return a.localeCompare(b); });
  }

  function getNodeAtPath(pathSegments) {
    var node = TREE;
    for (var i = 0; i < pathSegments.length; i++) {
      if (!node || node.isFile || !node.children[pathSegments[i]]) return null;
      node = node.children[pathSegments[i]];
    }
    return node;
  }

  function currentPathFromHash() {
    var raw = location.hash.replace(/^#/, '');
    if (!raw) return [];
    return raw.split('/').filter(Boolean).map(function (s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    });
  }

  function pathToHash(pathSegments) {
    return pathSegments.map(encodeURIComponent).join('/');
  }

  function svgIcon(pathHTML) {
    var span = document.createElement('span');
    span.className = 'icon';
    span.setAttribute('aria-hidden', 'true');
    span.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + pathHTML + '</svg>';
    return span;
  }

  function folderIcon() {
    return svgIcon('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>');
  }

  function fileIcon() {
    return svgIcon('<path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M14 2v5h5"/>');
  }

  function upIcon() {
    var span = document.createElement('span');
    span.className = 'icon';
    span.setAttribute('aria-hidden', 'true');
    span.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>';
    return span;
  }

  function chevronIcon() {
    var span = document.createElement('span');
    span.className = 'chev';
    span.setAttribute('aria-hidden', 'true');
    span.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>';
    return span;
  }

  function externalIcon() {
    var span = document.createElement('span');
    span.className = 'chev';
    span.setAttribute('aria-hidden', 'true');
    span.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
    return span;
  }

  function renderBreadcrumb(pathSegments) {
    breadcrumbEl.innerHTML = '';
    var home = document.createElement('a');
    home.href = '#';
    home.textContent = REPO_NAME;
    if (pathSegments.length === 0) home.className = 'current';
    breadcrumbEl.appendChild(home);

    var acc = [];
    pathSegments.forEach(function (seg, idx) {
      acc.push(seg);
      var sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '/';
      breadcrumbEl.appendChild(sep);

      if (idx === pathSegments.length - 1) {
        var cur = document.createElement('span');
        cur.className = 'current';
        cur.textContent = seg;
        breadcrumbEl.appendChild(cur);
      } else {
        var a = document.createElement('a');
        a.href = '#' + pathToHash(acc.slice());
        a.textContent = seg;
        breadcrumbEl.appendChild(a);
      }
    });
  }

  function renderListing(pathSegments) {
    var node = getNodeAtPath(pathSegments);
    var effectivePath = pathSegments;
    var wasInvalid = false;
    if (!node) {
      wasInvalid = true;
      var trial = pathSegments.slice();
      while (trial.length && !getNodeAtPath(trial)) trial.pop();
      effectivePath = trial;
      node = getNodeAtPath(trial) || TREE;
    }

    renderBreadcrumb(effectivePath);
    listingEl.innerHTML = '';

    if (wasInvalid) {
      var warn = document.createElement('p');
      warn.className = 'notice';
      warn.textContent = 'Percorso non trovato: mostro il livello disponibile più vicino.';
      listingEl.appendChild(warn);
    }

    if (effectivePath.length > 0) {
      var up = document.createElement('a');
      up.href = '#' + pathToHash(effectivePath.slice(0, -1));
      up.className = 'row up';
      up.appendChild(upIcon());
      var upLabel = document.createElement('span');
      upLabel.className = 'label';
      var upName = document.createElement('span');
      upName.className = 'name';
      upName.textContent = 'Torna alla cartella superiore';
      upLabel.appendChild(upName);
      up.appendChild(upLabel);
      listingEl.appendChild(up);
    }

    var keys = sortedKeys(node.children);
    var folders = [];
    var files = [];
    keys.forEach(function (k) {
      var child = node.children[k];
      if (child.isFile) {
        if (isLinkable(child.name)) files.push(child);
      } else if (countLinkable(child) > 0) {
        folders.push({ key: k, node: child });
      }
    });

    if (folders.length === 0 && files.length === 0) {
      var empty = document.createElement('p');
      empty.className = 'notice';
      empty.textContent = 'Questa cartella non contiene pagine .html.';
      listingEl.appendChild(empty);
    }

    folders.forEach(function (f) {
      var color = colorForName(f.key);
      var a = document.createElement('a');
      a.href = '#' + pathToHash(effectivePath.concat([f.key]));
      a.className = 'row folder';
      a.style.borderLeftColor = color;

      var icon = folderIcon();
      icon.style.color = color;
      a.appendChild(icon);

      var labelWrap = document.createElement('span');
      labelWrap.className = 'label';
      var nameSpan = document.createElement('span');
      nameSpan.className = 'name';
      nameSpan.textContent = f.key + '/';
      labelWrap.appendChild(nameSpan);
      a.appendChild(labelWrap);

      var countSpan = document.createElement('span');
      countSpan.className = 'count';
      countSpan.textContent = countLinkable(f.node);
      countSpan.style.color = color;
      countSpan.style.background = hexToRgba(color, 0.16);
      a.appendChild(countSpan);

      a.appendChild(chevronIcon());
      listingEl.appendChild(a);
    });

    files.forEach(function (fc) {
      var a = document.createElement('a');
      a.href = fc.path;
      a.target = '_blank';
      a.rel = 'noopener';
      a.className = 'row file';
      a.appendChild(fileIcon());
      var labelWrap = document.createElement('span');
      labelWrap.className = 'label';
      var nameSpan = document.createElement('span');
      nameSpan.className = 'name';
      nameSpan.textContent = fc.label;
      labelWrap.appendChild(nameSpan);
      a.appendChild(labelWrap);
      a.appendChild(externalIcon());
      listingEl.appendChild(a);
    });
  }

  function renderSearch(query) {
    breadcrumbEl.innerHTML = '';
    var label = document.createElement('span');
    label.textContent = 'Risultati per "' + query + '"';
    breadcrumbEl.appendChild(label);

    listingEl.innerHTML = '';
    var matches = [];
    (function walk(node, pathParts) {
      var keys = sortedKeys(node.children);
      keys.forEach(function (k) {
        var child = node.children[k];
        if (child.isFile) {
          if (isLinkable(child.name) && child.label.toLowerCase().indexOf(query) !== -1) {
            matches.push({ label: child.label, path: child.path, context: pathParts.join(' / ') });
          }
        } else {
          walk(child, pathParts.concat([k]));
        }
      });
    })(TREE, []);

    if (matches.length === 0) {
      var empty = document.createElement('p');
      empty.className = 'notice';
      empty.textContent = 'Nessun risultato.';
      listingEl.appendChild(empty);
      return;
    }

    matches.forEach(function (m) {
      var a = document.createElement('a');
      a.href = m.path;
      a.target = '_blank';
      a.rel = 'noopener';
      a.className = 'row file';
      a.appendChild(fileIcon());
      var labelWrap = document.createElement('span');
      labelWrap.className = 'label';
      var nameSpan = document.createElement('span');
      nameSpan.className = 'name';
      nameSpan.textContent = m.label;
      labelWrap.appendChild(nameSpan);
      var contextSpan = document.createElement('span');
      contextSpan.className = 'context';
      contextSpan.textContent = m.context;
      labelWrap.appendChild(contextSpan);
      a.appendChild(labelWrap);
      a.appendChild(externalIcon());
      listingEl.appendChild(a);
    });
  }

  function route() {
    if (!TREE) return;
    var q = searchInput.value.trim().toLowerCase();
    if (q) {
      renderSearch(q);
    } else {
      renderListing(currentPathFromHash());
    }
  }

  function init() {
    var url = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/git/trees/' + REPO_BRANCH + '?recursive=1';

    fetch(url)
      .then(function (res) {
        if (res.status === 404) throw new Error('repository non trovato — controlla username, nome del repository e branch in cima al file');
        if (res.status === 403) throw new Error('limite di richieste a GitHub raggiunto per questa ora, riprova più tardi');
        if (!res.ok) throw new Error('errore nel contattare GitHub (codice ' + res.status + ')');
        return res.json();
      })
      .then(function (data) {
        TREE = buildTree(data.tree || []);
        var total = countLinkable(TREE);
        statusEl.textContent = total + (total === 1 ? ' pagina trovata' : ' pagine trovate') + ' — sempre aggiornato da GitHub' + (data.truncated ? ' (elenco troncato: repository molto grande)' : '');
        route();
      })
      .catch(function (err) {
        statusEl.textContent = 'Errore: ' + err.message;
        statusEl.classList.add('error');
      });
  }

  window.addEventListener('hashchange', route);
  searchInput.addEventListener('input', route);

  init();
})();
</script>

</body>
</html>
