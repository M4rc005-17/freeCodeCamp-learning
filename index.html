<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>freeCodeCamp — indice esercizi (live)</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap");

      :root {
        --ink: #0b0e14;
        --panel: #11151d;
        --wire: #2a3142;
        --mist: #6e7681;
        --text: #d5d9e0;
        --warn: #ff9e64;
      }

      * {
        box-sizing: border-box;
      }
      html {
        color-scheme: dark;
      }

      body {
        margin: 0;
        background: var(--ink);
        color: var(--text);
        font-family:
          "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas,
          monospace;
        line-height: 1.65;
        font-size: 16px;
      }

      .noscript-msg {
        max-width: 600px;
        margin: 3rem auto;
        padding: 1rem;
        text-align: center;
        color: var(--warn);
      }

      header {
        max-width: 760px;
        margin: 0 auto;
        padding: clamp(2.5rem, 6vw, 4.5rem) 1.25rem 1.5rem;
        text-align: center;
      }
      .prompt-line {
        color: var(--mist);
        margin: 0 0 0.6em;
        font-size: 0.9em;
      }
      h1 {
        font-size: clamp(1.4rem, 4vw, 2rem);
        font-weight: 700;
        margin: 0 0 0.5em;
        word-break: break-word;
      }
      .comment {
        color: var(--mist);
        margin: 0;
        font-size: 0.92em;
      }
      .comment.error {
        color: var(--warn);
      }

      .search-wrap {
        display: flex;
        align-items: center;
        gap: 0.5em;
        max-width: 380px;
        margin: 1.6em auto 0;
        padding: 0.55em 0.9em;
        border: 1px solid var(--wire);
        border-radius: 6px;
        background: var(--panel);
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }
      .search-wrap .glyph {
        color: var(--mist);
      }
      .search-wrap:focus-within {
        border-color: #7aa2f7;
        box-shadow: 0 0 0 3px rgba(122, 162, 247, 0.15);
      }
      #search {
        flex: 1;
        border: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 1rem;
      }
      #search:focus {
        outline: none;
      }
      #search::placeholder {
        color: var(--mist);
      }
      #resultsCount {
        min-height: 1.4em;
        margin: 0.6em 0 0;
        color: var(--mist);
        font-size: 0.85em;
      }

      main.tree {
        max-width: 760px;
        margin: 0 auto;
        padding: 0.5rem 1.25rem 4rem;
      }

      .tree details.topic {
        margin: 0.5em 0;
      }
      .tree summary {
        cursor: pointer;
        list-style: none;
        padding: 0.2em 0;
      }
      .tree summary::-webkit-details-marker {
        display: none;
      }
      .tree summary::before {
        content: "▸";
        display: inline-block;
        width: 1.1em;
        color: var(--wire);
      }
      .tree details[open] > summary::before {
        content: "▾";
      }

      .tree details.topic > summary {
        color: var(--text);
        font-weight: 600;
      }
      .tree details.topic.toplevel > summary {
        color: var(--accent);
        font-weight: 700;
        font-size: 1.05em;
      }
      .tree .count {
        color: var(--mist);
        font-weight: 400;
        font-size: 0.85em;
      }

      .sub {
        margin-left: 0.5em;
        padding-left: 1.1em;
        border-left: 1px solid var(--wire);
      }

      .tree ul {
        list-style: none;
        margin: 0 0 0.2em;
        padding: 0;
      }
      .tree li {
        margin: 0.15em 0;
      }
      .tree a {
        color: var(--text);
        text-decoration: none;
        border-bottom: 1px solid transparent;
        padding: 0.05em 0;
      }
      .tree a:hover {
        color: #9aa5b1;
        border-bottom-color: currentColor;
      }
      .tree details.toplevel a:hover {
        color: var(--accent);
      }
      .tree a:focus-visible,
      .tree summary:focus-visible {
        outline: 2px solid var(--wire);
        outline-offset: 2px;
      }

      .hidden {
        display: none !important;
      }

      footer {
        max-width: 760px;
        margin: 0 auto;
        padding: 1rem 1.25rem 3rem;
        color: var(--mist);
        font-size: 0.85em;
      }

      @media (max-width: 380px) {
        .sub {
          margin-left: 0.3em;
          padding-left: 0.8em;
        }
        body {
          font-size: 15px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <noscript
      ><p class="noscript-msg">
        Questa pagina richiede JavaScript per leggere ed elencare i file dal
        repository GitHub.
      </p></noscript
    >

    <header>
      <p class="prompt-line">$ tree freeCodeCamp/ --live</p>
      <h1>freeCodeCamp/</h1>
      <p class="comment" id="statusLine"># caricamento in corso…</p>
      <search class="search-wrap">
        <span class="glyph" aria-hidden="true">›</span>
        <input
          type="text"
          id="search"
          placeholder="Cerca un esercizio…"
          aria-label="Cerca un esercizio"
        />
      </search>
      <p id="resultsCount" aria-live="polite"></p>
    </header>

    <main class="tree" id="treeRoot"></main>

    <footer>
      <p class="comment">
        # aggiornato automaticamente da GitHub — repository
        <span id="repoLabel"></span>
      </p>
    </footer>

    <script>
      (function () {
        "use strict";

        // ====================================================================
        // CONFIGURAZIONE — modifica queste 3 righe con i tuoi dati, poi salva
        var REPO_OWNER = "M4rc005-17";
        var REPO_NAME = "freeCodeCamp";
        var REPO_BRANCH = "main";
        // ====================================================================

        var ACCENT_PALETTE = [
          "#7aa2f7",
          "#ff9e64",
          "#9ece6a",
          "#bb9af7",
          "#f7768e",
          "#e0af68",
        ];

        var statusLine = document.getElementById("statusLine");
        var treeRoot = document.getElementById("treeRoot");
        var repoLabel = document.getElementById("repoLabel");
        var search = document.getElementById("search");
        var resultsCount = document.getElementById("resultsCount");

        repoLabel.textContent = REPO_OWNER + "/" + REPO_NAME;

        function isLinkable(filename) {
          return /\.html?$/i.test(filename);
        }

        function colorForName(name) {
          var hash = 0;
          for (var i = 0; i < name.length; i++) {
            hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
          }
          return ACCENT_PALETTE[hash % ACCENT_PALETTE.length];
        }

        function buildTree(flatList) {
          var root = { name: "", isFile: false, children: {} };
          flatList.forEach(function (entry) {
            if (entry.type !== "blob") return;
            var parts = entry.path.split("/");
            var node = root;
            for (var i = 0; i < parts.length; i++) {
              var part = parts[i];
              var isLast = i === parts.length - 1;
              if (isLast) {
                if (parts.length === 1 && part.toLowerCase() === "index.html")
                  return;
                var base = part.replace(/\.html?$/i, "");
                var label = base;
                if (base.toLowerCase() === "index" && parts.length > 1) {
                  label = parts[parts.length - 2];
                }
                node.children[part] = {
                  name: part,
                  isFile: true,
                  path: entry.path,
                  label: label,
                  children: {},
                };
              } else {
                if (!node.children[part]) {
                  node.children[part] = {
                    name: part,
                    isFile: false,
                    children: {},
                  };
                }
                node = node.children[part];
              }
            }
          });
          return root;
        }

        function countLinkable(node) {
          if (node.isFile) return isLinkable(node.name) ? 1 : 0;
          var total = 0;
          Object.keys(node.children).forEach(function (k) {
            total += countLinkable(node.children[k]);
          });
          return total;
        }

        function sortedKeys(obj) {
          return Object.keys(obj).sort(function (a, b) {
            return a.localeCompare(b, "it", { sensitivity: "base" });
          });
        }

        function renderLeaf(fileNode) {
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.href = fileNode.path;
          a.textContent = fileNode.label;
          li.appendChild(a);
          return li;
        }

        function renderFolder(node, name, depth) {
          var keys = sortedKeys(node.children);
          var fileChildren = [];
          var folderKeys = [];
          keys.forEach(function (k) {
            var child = node.children[k];
            if (child.isFile) {
              if (isLinkable(child.name)) fileChildren.push(child);
            } else if (countLinkable(child) > 0) {
              folderKeys.push(k);
            }
          });

          if (fileChildren.length === 0 && folderKeys.length === 0) return null;

          var details = document.createElement("details");
          details.className = depth === 0 ? "topic toplevel" : "topic";
          details.open = true;
          if (depth === 0)
            details.style.setProperty("--accent", colorForName(name));

          var summary = document.createElement("summary");
          var nameSpan = document.createElement("span");
          nameSpan.textContent = name + "/";
          var countSpan = document.createElement("span");
          countSpan.className = "count";
          countSpan.textContent = " (" + countLinkable(node) + ")";
          summary.appendChild(nameSpan);
          summary.appendChild(countSpan);
          details.appendChild(summary);

          var sub = document.createElement("div");
          sub.className = "sub";

          folderKeys.forEach(function (k) {
            var el = renderFolder(node.children[k], k, depth + 1);
            if (el) sub.appendChild(el);
          });

          if (fileChildren.length > 0) {
            var ul = document.createElement("ul");
            fileChildren.forEach(function (fc) {
              ul.appendChild(renderLeaf(fc));
            });
            sub.appendChild(ul);
          }

          details.appendChild(sub);
          return details;
        }

        function render(root) {
          treeRoot.innerHTML = "";
          var keys = sortedKeys(root.children);
          var folderKeys = [];
          var fileNodes = [];
          keys.forEach(function (k) {
            var child = root.children[k];
            if (child.isFile) {
              if (isLinkable(child.name)) fileNodes.push(child);
            } else if (countLinkable(child) > 0) {
              folderKeys.push(k);
            }
          });

          var count = 0;
          folderKeys.forEach(function (k) {
            var el = renderFolder(root.children[k], k, 0);
            if (el) {
              treeRoot.appendChild(el);
              count++;
            }
          });

          if (fileNodes.length > 0) {
            var ul = document.createElement("ul");
            fileNodes.forEach(function (fc) {
              ul.appendChild(renderLeaf(fc));
            });
            treeRoot.appendChild(ul);
            count++;
          }

          return count;
        }

        function setupFilter() {
          var leaves = Array.prototype.slice.call(
            treeRoot.querySelectorAll("li"),
          );
          var groups = Array.prototype.slice.call(
            treeRoot.querySelectorAll("details"),
          );

          function run() {
            var q = search.value.trim().toLowerCase();
            var active = q.length > 0;

            leaves.forEach(function (li) {
              var match =
                !active || li.textContent.toLowerCase().indexOf(q) !== -1;
              li.classList.toggle("hidden", active && !match);
            });

            groups.forEach(function (d) {
              var anyVisible = d.querySelectorAll("li:not(.hidden)").length > 0;
              d.classList.toggle("hidden", active && !anyVisible);
              if (active && anyVisible) d.open = true;
            });

            var visibleCount = leaves.filter(function (li) {
              return !li.classList.contains("hidden");
            }).length;
            resultsCount.textContent = active
              ? visibleCount +
                (visibleCount === 1 ? " risultato" : " risultati")
              : "";
          }

          search.addEventListener("input", run);
        }

        function init() {
          if (REPO_OWNER === "M4rc005-17") {
            statusLine.textContent =
              "# ricorda di inserire il tuo username GitHub nella configurazione in cima al file index.html";
            statusLine.classList.add("error");
            return;
          }

          statusLine.textContent = "# caricamento dei file dal repository…";
          var url =
            "https://api.github.com/repos/" +
            REPO_OWNER +
            "/" +
            REPO_NAME +
            "/git/trees/" +
            REPO_BRANCH +
            "?recursive=1";

          fetch(url)
            .then(function (res) {
              if (res.status === 404)
                throw new Error(
                  "repository non trovato — controlla username, nome del repository e branch in cima al file index.html",
                );
              if (res.status === 403)
                throw new Error(
                  "limite di richieste a GitHub raggiunto per questa ora, riprova più tardi",
                );
              if (!res.ok)
                throw new Error(
                  "errore nel contattare GitHub (codice " + res.status + ")",
                );
              return res.json();
            })
            .then(function (data) {
              var tree = buildTree(data.tree || []);
              var groupCount = render(tree);
              var leafCount = countLinkable(tree);
              if (groupCount === 0) {
                statusLine.textContent =
                  "# nessuna pagina .html trovata nel repository";
              } else {
                statusLine.textContent =
                  "# " +
                  leafCount +
                  (leafCount === 1 ? " pagina trovata" : " pagine trovate") +
                  " — aggiornato dal vivo da GitHub" +
                  (data.truncated
                    ? " (elenco troncato: repository molto grande)"
                    : "");
              }
              setupFilter();
            })
            .catch(function (err) {
              statusLine.textContent = "# " + err.message;
              statusLine.classList.add("error");
            });
        }

        init();
      })();
    </script>
  </body>
</html>
