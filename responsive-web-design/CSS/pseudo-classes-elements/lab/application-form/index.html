<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Job Application Form</title>
  </head>
  <body>
    <div class="container">
      <form>
        <label for="name">Full Name:</label>
        <input
          type="text"
          name="name"
          id="name"
          required
          placeholder="Enter your name"
        />
        <label for="email">Email:</label>
        <input
          type="email"
          name="email"
          id="email"
          required
          placeholder="Enter your email"
        />
        <label for="position">Position:</label>
        <select name="position" class="position" required>
          <option selected>Select a position</option>
          <option value="developer">Developer</option>
          <option value="designer">Designer</option>
          <option value="manager">Manager</option>
        </select>
        <fieldset class="radio-group">
          <legend>Availability:</legend>
          <input type="radio" name="availability" id="full" checked />
          <label for="full">Full-Time</label>
          <input type="radio" name="availability" id="part" />
          <label for="part">Part-Time</label>
        </fieldset>
        <label for="message">Why do you want this job?</label>
        <textarea
          name="message"
          id="message"
          required
          placeholder="Write your motivation"
          rows="5"
        ></textarea>
        <button type="submit">Submit Application</button>
      </form>
    </div>
  </body>
</html>
