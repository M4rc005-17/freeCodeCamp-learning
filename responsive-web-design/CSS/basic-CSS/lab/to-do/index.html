<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styled To-Do List</title>
  </head>
  <body>
    <ul class="todo-list">
      <li>
        <input type="checkbox" id="primo" />
        <label for="primo">Explore gaming keyboards</label>
        <ul class="sub-item">
          <li>
            <a
              href="http://"
              target="_blank"
              rel="noopener noreferrer"
              class="sub-item-link"
              >Store link</a
            >
          </li>
        </ul>
      </li>
      <li>
        <input type="checkbox" id="secondo" />
        <label for="secondo">Finish the report</label>
        <ul class="sub-item">
          <li>
            <a
              href="http://"
              target="_blank"
              rel="noopener noreferrer"
              class="sub-item-link"
              >Request Access</a
            >
          </li>
        </ul>
      </li>
      <li>
        <input type="checkbox" id="terzo" />
        <label for="terzo">View Phone's Warranty</label>
        <ul class="sub-item">
          <li>
            <a
              href="http://"
              target="_blank"
              rel="noopener noreferrer"
              class="sub-item-link"
              >View Receipts</a
            >
          </li>
        </ul>
      </li>
      <li>
        <input type="checkbox" id="quarto" />
        <label for="quarto">Check Processor Specs</label>
        <ul class="sub-item">
          <li>
            <a
              href="http://"
              target="_blank"
              rel="noopener noreferrer"
              class="sub-item-link"
              >View Model Number</a
            >
          </li>
        </ul>
      </li>
    </ul>
  </body>
</html>
